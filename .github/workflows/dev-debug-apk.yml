name: Dev Debug APK

# 供本地 Metro 热更新使用：车机装这个包，电脑 npm start 后改 JS 即时生效。
# 不发布到 Release，只作为工作流产出物保留 30 天。
on:
  workflow_dispatch:

jobs:
  Android:
    name: Android (arm64 debug)
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Build Debug APK
        env:
          DISABLE_SVG: 1
        shell: bash
        run: |
          cd android
          ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WecarFlow-debug-arm64
          # build.gradle 的输出名改写给所有 variant 生效，debug 包同样不带 -debug 后缀
          path: android/app/build/outputs/apk/debug/*-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30
